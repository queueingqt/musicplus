# Light Phone III tool manifest. Schema per lightphone/light-sdk docs/tool_metadata/README.md.

[tool]
id            = "com.musicplus.app"
label         = "Music +"
versionCode   = 13
versionName   = "0.8.0"

# INTERNET is for the Navidrome/Subsonic API. Do NOT list FOREGROUND_SERVICE or
# FOREGROUND_SERVICE_MEDIA_PLAYBACK here — the "detached-audio" capability below
# generates those automatically; declaring them manually fails the build.
permissions   = ["android.permission.INTERNET"]

# detached-audio: background/locked-screen playback via LightAudioPlayback.Detached.
# cleartext-http: the user's own Navidrome/Subsonic server is usually plain http:// on
# their LAN or tailnet, which Android blocks by default.
capabilities  = ["detached-audio", "cleartext-http"]

orientation   = "portrait"

# "com.lightos" for the real device (and for Light's build server). Switch to
# "com.thelightphone.sdk.emulator" only for local dev against the SDK emulator.
serverPackage = "com.lightos"
